<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Бинды игр на объёмной клавиатуре и мыши" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotkey Map</title>
    <script>
      // FR-25: тема прошлого запуска до загрузки данных, чтобы тёмная не мигала светлой
      try {
        const theme = localStorage.getItem('hotkey-map:theme') || 'system'
        const dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch {
        // Без localStorage тема применится после загрузки данных
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
